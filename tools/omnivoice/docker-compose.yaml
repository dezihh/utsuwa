name: omnivoice-proxy

services:
  omnivoice-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivoice-proxy
    ipc: host
    shm_size: "2g"
    ports:
      - "8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - omnivoice-cache:/data/hf_cache
      - omnivoice-voices:/data/voices
    restart: unless-stopped

volumes:
  omnivoice-cache:
  omnivoice-voices:
