#   docker compose build utsuwa-prod && docker compose up -d utsuwa-prod --force-recreate
name: utsuwa

services:
  # ── Development Server ────────────────────────────────────
  utsuwa-dev:
    image: node:22-bookworm-slim
    container_name: utsuwa-dev
    network_mode: host
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      PNPM_HOME: /pnpm
      UTSUWA_PROFILE_SYNC_ENABLED: "true"
      UTSUWA_DATA_DIR: "/tmp/utsuwa-data"
      ALLOW_LOCAL_PROVIDER_HOSTS: "true"
    volumes:
      - ..:/app
      - utsuwa-node-modules:/app/node_modules
      - pnpm-store:/pnpm

  # ── Production Server ─────────────────────────────────────
  utsuwa-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: utsuwa-prod
    network_mode: host
    environment:
      PORT: "3001"
      NODE_ENV: production
      UTSUWA_PROFILE_SYNC_ENABLED: "true"
      UTSUWA_DATA_DIR: "/data"
      BODY_SIZE_LIMIT: "209715200"  # 200 MB
    volumes:
      - utsuwa-prod-data:/data
    restart: unless-stopped

  # ── OmniVoice Proxy (OpenAI-kompatibel) ──────────────────
  omnivoice-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.omnivoice-proxy
    container_name: omnivoice-proxy
    network_mode: host
    ipc: host
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - omnivoice-cache:/data/hf_cache
      - omnivoice-voices:/data/voices
    restart: unless-stopped

volumes:
  utsuwa-node-modules:
  pnpm-store:
  utsuwa-prod-data:
  omnivoice-cache:
  omnivoice-voices: