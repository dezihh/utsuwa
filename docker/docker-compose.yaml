name: utsuwa

services:
  # ── Development Server ────────────────────────────────────
  utsuwa:
    image: node:22-bookworm-slim
    container_name: utsuwa
    network_mode: host
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      PNPM_HOME: /pnpm
      UTSUWA_PROFILE_SYNC_ENABLED: "true"
      UTSUWA_DATA_DIR: "/tmp/utsuwa-data"
    volumes:
      - ..:/app
      - utsuwa-node-modules:/app/node_modules
      - pnpm-store:/pnpm

  # ── Production Server ─────────────────────────────────────
  utsuwa-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: utsuwa-prod
    network_mode: host
    environment:
      PORT: "3001"
      NODE_ENV: production
      UTSUWA_PROFILE_SYNC_ENABLED: "true"
      UTSUWA_DATA_DIR: "/data"
      BODY_SIZE_LIMIT: "209715200"  # 200 MB
    volumes:
      - utsuwa-prod-data:/data
    restart: unless-stopped

volumes:
  utsuwa-node-modules:
  pnpm-store:
  utsuwa-prod-data:
