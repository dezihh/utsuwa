# Production deployment for Utsuwa
# Build context is the project root (../)
#
# Start:   docker compose -f docker-compose.prod.yaml up -d --build
# Rebuild: docker compose -f docker-compose.prod.yaml up -d --build --force-recreate
#
# To enable server-side profile sync, set:
#   UTSUWA_PROFILE_SYNC_ENABLED: "true"
# Profile data is stored in the utsuwa-prod-data volume at /data inside the container.

services:
  utsuwa-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: utsuwa-prod
    network_mode: host
    environment:
      PORT: "3001"
      NODE_ENV: production
      UTSUWA_PROFILE_SYNC_ENABLED: "true"
      UTSUWA_DATA_DIR: "/data"
    volumes:
      - utsuwa-prod-data:/data
    restart: unless-stopped

volumes:
  utsuwa-prod-data:
